<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics Practice Quiz</title>
    <script src="quiz1_questions.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .header p { font-size: 1.1rem; opacity: 0.9; }

        .user-form {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn:disabled { 
            background: #6c757d; 
            cursor: not-allowed; 
            transform: none; 
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-container {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 1px solid #e9ecef;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-weight: 600;
        }

        .question-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }

        .btn-nav {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .btn-nav:hover:not(:disabled) {
            background: #545b62;
            transform: translateY(-1px);
        }

        .btn-nav:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-next:hover:not(:disabled) {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
        }

        .question-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #666;
        }

        .status-answered {
            background: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .status-unanswered {
            background: #dc3545;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .quiz-container { padding: 30px; display: none; }

        .question-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 5px solid #667eea;
        }

        .question-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .question-number {
            background: #667eea;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 15px;
        }

        .question-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;
            margin-bottom: 20px;
            white-space: pre-line;
        }

        .options { display: flex; flex-direction: column; gap: 12px; }

        .option {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option:hover { border-color: #667eea; background: #f0f8ff; }
        .option.selected { border-color: #667eea; background: #e3f2fd; }

        .numeric-input {
            width: 200px;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
        }

        .results-container {
            display: none;
            padding: 30px;
            text-align: center;
        }

        .score-display {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .score-display h2 { font-size: 2.5rem; margin-bottom: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Statistics Practice Quiz</h1>
            <p>Test your statistical knowledge with 15 comprehensive questions</p>
        </div>

        <!-- Quiz Container -->
        <div id="quizContainer" class="quiz-container" style="display: none;">
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Question 1 of 15</div>
            </div>
            
            <div id="questionContainer"></div>
            
            <div class="question-navigation">
                <button class="btn-nav" id="prevBtn" onclick="previousQuestion()" disabled>← Previous</button>
                <div class="question-status">
                    <span id="questionStatus">Question 1 of 15</span>
                    <span id="answeredStatus" class="status-unanswered">Unanswered</span>
                </div>
                <button class="btn-nav btn-next" id="nextBtn" onclick="nextQuestion()">Next →</button>
            </div>
            
            <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 2px solid #667eea;">
                <button class="btn" onclick="submitQuiz()" id="submitBtn">
                    <span id="submitText">📊 Submit Statistics Quiz</span>
                    <span id="submitLoading" class="loading" style="display: none;"></span>
                </button>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen" class="quiz-container" style="text-align: center; padding: 60px;">
            <div class="loading" style="width: 40px; height: 40px; margin: 0 auto 20px;"></div>
            <h3>Loading Statistics Quiz...</h3>
            <p>Verifying your session and preparing questions</p>
        </div>

        <!-- Results -->
        <div id="resultsContainer" class="results-container">
            <div class="score-display">
                <h2 id="finalScore">0/15</h2>
                <p>Quiz Completed Successfully!</p>
            </div>
            <button class="btn" onclick="goback()">Home Page</button>
        </div>
    </div>

    <script>
        let userAnswers = {};
        let currentUser = {};
        let username = null;
        let email = null;
        let currentQuestionIndex = 0;

        // Fetch user session info and start quiz immediately
        async function fetchSessionInfo() {
            try {
                const response = await fetch('https://sanghamitra-learnworld.vercel.app/api/session-info', {
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    username = data.username;
                    email = data.email;
                    console.log("User:", username, "Email:", email);
                    return true;
                } else {
                    console.error('Failed to fetch session info');
                    alert('Please login to take the assessment');
                    window.location.href = '/login.html';
                    return false;
                }
            } catch (error) {
                console.error('Error fetching session info:', error);
                alert('Error connecting to server. Please try again.');
                return false;
            }
        }

        // Initialize quiz directly without user form
        async function initializeQuiz() {
            try {
                const sessionValid = await fetchSessionInfo();
                if (sessionValid) {
                    currentUser = { username, email };
                    
                    // Hide loading screen and show quiz
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('quizContainer').style.display = 'block';
                    
                    renderCurrentQuestion();
                    updateProgress();
                }
            } catch (error) {
                console.error('Error initializing quiz:', error);
                alert('Failed to initialize quiz. Please try again.');
            }
        }

        function renderCurrentQuestion() {
            const container = document.getElementById('questionContainer');
            const question = questions[currentQuestionIndex];
            
            container.innerHTML = '';

            const questionDiv = document.createElement('div');
            questionDiv.className = 'question-card';

            let optionsHtml = '';
            if (question.type === 'multiple_choice') {
                optionsHtml = question.options.map((option, optIndex) => `
                    <div class="option" onclick="selectOption(${currentQuestionIndex}, '${option.replace(/'/g, "\\'")}', 'radio')">
                        <input type="radio" name="q${currentQuestionIndex}" value="${option}" id="q${currentQuestionIndex}_${optIndex}">
                        <label for="q${currentQuestionIndex}_${optIndex}">${option}</label>
                    </div>
                `).join('');
            } else if (question.type === 'multiple_select') {
                optionsHtml = question.options.map((option, optIndex) => `
                    <div class="option" onclick="selectOption(${currentQuestionIndex}, '${option.replace(/'/g, "\\'")}', 'checkbox')">
                        <input type="checkbox" name="q${currentQuestionIndex}" value="${option}" id="q${currentQuestionIndex}_${optIndex}">
                        <label for="q${currentQuestionIndex}_${optIndex}">${option}</label>
                    </div>
                `).join('');
            } else if (question.type === 'numeric') {
                optionsHtml = `<input type="number" class="numeric-input" placeholder="Enter your answer" 
                               step="0.01" onchange="handleNumericInput(${currentQuestionIndex}, this.value)">`;
            }

            questionDiv.innerHTML = `
                <div class="question-header">
                    <div class="question-number">${question.question_number}</div>
                    <div style="font-weight: 600;">Points: ${question.points}</div>
                </div>
                <div class="question-text">${question.question_text}</div>
                <div class="options">${optionsHtml}</div>
            `;

            container.appendChild(questionDiv);
            
            // Restore previous answer if exists
            restoreAnswer();
            updateAnswerStatus();
        }

        function restoreAnswer() {
            const question = questions[currentQuestionIndex];
            const savedAnswer = userAnswers[currentQuestionIndex];
            
            if (!savedAnswer) return;

            if (question.type === 'multiple_choice') {
                const option = document.querySelector(`input[value="${savedAnswer}"]`);
                if (option) {
                    option.checked = true;
                    option.closest('.option').classList.add('selected');
                }
            } else if (question.type === 'multiple_select' && Array.isArray(savedAnswer)) {
                savedAnswer.forEach(answer => {
                    const option = document.querySelector(`input[value="${answer}"]`);
                    if (option) {
                        option.checked = true;
                        option.closest('.option').classList.add('selected');
                    }
                });
            } else if (question.type === 'numeric') {
                const input = document.querySelector('.numeric-input');
                if (input) {
                    input.value = savedAnswer;
                }
            }
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressText').textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('questionStatus').textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            
            // Update navigation buttons
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            
            const nextBtn = document.getElementById('nextBtn');
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.textContent = 'Finish →';
                nextBtn.onclick = () => {
                    document.getElementById('quizContainer').scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'end' 
                    });
                };
            } else {
                nextBtn.textContent = 'Next →';
                nextBtn.onclick = nextQuestion;
            }
        }

        function updateAnswerStatus() {
            const statusSpan = document.getElementById('answeredStatus');
            const hasAnswer = userAnswers[currentQuestionIndex] !== undefined;
            
            if (hasAnswer) {
                statusSpan.textContent = 'Answered';
                statusSpan.className = 'status-answered';
            } else {
                statusSpan.textContent = 'Unanswered';
                statusSpan.className = 'status-unanswered';
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                renderCurrentQuestion();
                updateProgress();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderCurrentQuestion();
                updateProgress();
            }
        }

        function selectOption(questionIndex, value, type) {
            if (type === 'radio') {
                userAnswers[questionIndex] = value;
                // Update UI
                const options = document.querySelectorAll(`input[name="q${questionIndex}"]`);
                options.forEach(opt => opt.closest('.option').classList.remove('selected'));
                event.target.closest('.option').classList.add('selected');
            } else if (type === 'checkbox') {
                if (!userAnswers[questionIndex]) userAnswers[questionIndex] = [];
                
                const checkbox = event.target.closest('.option').querySelector('input');
                if (checkbox.checked) {
                    if (!userAnswers[questionIndex].includes(value)) {
                        userAnswers[questionIndex].push(value);
                    }
                    event.target.closest('.option').classList.add('selected');
                } else {
                    userAnswers[questionIndex] = userAnswers[questionIndex].filter(ans => ans !== value);
                    event.target.closest('.option').classList.remove('selected');
                }
            }
        }

        function handleNumericInput(questionIndex, value) {
            userAnswers[questionIndex] = parseFloat(value) || value;
        }

        async function submitQuiz() {
            if (!username || !email) {
                alert("Error: User session data not found. Please log in.");
                return;
            }

            let score = 0;
            
            questions.forEach((question, index) => {
                const userAnswer = userAnswers[index];
                const correctAnswer = question.correct_answer;
                
                if (question.type === 'multiple_choice') {
                    if (userAnswer === correctAnswer) score++;
                } else if (question.type === 'multiple_select') {
                    if (Array.isArray(userAnswer) && Array.isArray(correctAnswer)) {
                        if (userAnswer.length === correctAnswer.length &&
                            userAnswer.every(ans => correctAnswer.includes(ans))) {
                            score++;
                        }
                    }
                } else if (question.type === 'numeric') {
                    const tolerance = 0.01;
                    if (Math.abs(parseFloat(userAnswer) - parseFloat(correctAnswer)) <= tolerance) {
                        score++;
                    }
                }
            });

            // Store score using Statistics API
            const quizData = {
                username: username,
                email: email,
                score: score,
                totalQuestions: questions.length,
                percentage: Math.round((score / questions.length) * 100),
                topic: 'Quiz1',
                answers: userAnswers
            };

            try {
                const response = await fetch('https://sanghamitra-learnworld.vercel.app/api/statistics_scores', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(quizData)
                });

                if (response.ok) {
                    console.log('Quiz submitted successfully');
                } else {
                    console.error('Failed to submit quiz');
                }
            } catch (error) {
                console.error('Error submitting quiz:', error);
            }
            
            // Show results
            document.getElementById('quizContainer').style.display = 'none';
            document.getElementById('resultsContainer').style.display = 'block';
            document.getElementById('finalScore').textContent = `${score}/${questions.length} (${Math.round((score/questions.length)*100)}%)`;
        }

        // Initialize the quiz when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeQuiz();
        });

        // Fallback for browsers that don't support DOMContentLoaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeQuiz);
        } else {
            // DOM is already loaded
            initializeQuiz();
        }

        function goback() {
            userAnswers = {};
            // go to statistics.html
            window.location.href = 'statistics.html';
        }
    </script>
</body>
</html>
